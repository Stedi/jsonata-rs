name: Release

permissions:
  contents: read

on:
  push:
    branches:
      - main

jobs:
  # Tags and publishes a GitHub release whenever the commits since the last tag
  # include a `feat:` or `fix:`. The version lives only in the tag.
  semantic-release:
    name: Semantic Release
    runs-on: ubuntu-slim
    concurrency:
      group: semantic-release
      cancel-in-progress: false
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Generate GitHub token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        id: generate-token
        with:
          # The RELEASE_PLZ_* names predate the move to semantic-release; they are the
          # only release credentials this public repository can read.
          app-id: ${{ secrets.RELEASE_PLZ_APP_ID }}
          private-key: ${{ secrets.RELEASE_PLZ_PRIVATE_KEY }}

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ steps.generate-token.outputs.token }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          package-manager-cache: false

      - name: Install semantic-release
        working-directory: .github/release
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Run semantic-release
        id: release
        working-directory: .github/release
        run: npx --no-install semantic-release
        env:
          GITHUB_TOKEN: ${{ steps.generate-token.outputs.token }}

  publish-crate:
    name: Publish to crates.io
    needs: semantic-release
    if: needs.semantic-release.outputs.version != ''
    runs-on: ubuntu-slim
    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: v${{ needs.semantic-release.outputs.version }}
      - run: |
          : set $CARGO_HOME
          echo CARGO_HOME=${CARGO_HOME:-"${{'$HOME/.cargo'}}"} >> $GITHUB_ENV
        shell: bash
      - run: |
          : install rustup if needed
          if ! command -v rustup &>/dev/null; then
            curl --proto '=https' --tlsv1.2 --retry 10 --retry-connrefused --location --silent --show-error --fail https://sh.rustup.rs | sh -s -- --profile default -y
            echo "$CARGO_HOME/bin" >> $GITHUB_PATH
          fi
        shell: bash
      - name: Stamp the release version into Cargo.toml
        env:
          VERSION: ${{ needs.semantic-release.outputs.version }}
        run: sed -i "0,/^version = \".*\"/s//version = \"$VERSION\"/" Cargo.toml
      - name: Cargo publish
        run: cargo publish --allow-dirty
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
